# ---------------------------------------------------------------------
# CropDisease AI Pro
# Local laptop: config/application.properties (not uploaded) holds the
# local MySQL login and overrides these values.
# ---------------------------------------------------------------------
spring.application.name=cropdisease-ai-pro

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cropdisease?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

server.port=${PORT:8081}
server.forward-headers-strategy=framework
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,application/json

# Leaf photo uploads (stored in the MySQL "media" table)
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=16MB

# Live weather for the disease-risk forecast (free, no API key)
app.weather.forecast-url=https://api.open-meteo.com/v1/forecast
app.weather.geocode-url=https://geocoding-api.open-meteo.com/v1/search
