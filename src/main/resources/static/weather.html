<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Weather Disease Risk · CropDisease AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/app.css" rel="stylesheet">
    <meta name="theme-color" content="#060D0A">
    <link rel="icon" href="img/logo.svg" type="image/svg+xml">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body>
<div class="bg-orbs"><span></span><span></span><span></span></div>
<div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main"><div class="content">
        <div class="mobile-head align-items-center mb-3" id="mobileHead"></div>
        <div class="topbar">
            <div class="flex-grow-1"><div class="small-caps">Live forecast · Open-Meteo</div><h1>Weather Disease Risk</h1>
                <div class="sub">7-day infection risk for blights, leaf spots, rusts, mildew and bacterial diseases.</div></div>
        </div>

        <div class="glass glass-sm mb-3 reveal d1">
            <div class="d-flex flex-wrap gap-2 align-items-center position-relative">
                <div class="input-group flex-grow-1" style="max-width:440px"><span class="input-group-text"><i class="bi bi-geo-alt"></i></span>
                    <input class="form-control" id="place" placeholder="Search village / city e.g. Nashik" autocomplete="off"></div>
                <button class="btn btn-glass" id="gps"><i class="bi bi-crosshair"></i> My location</button>
                <span class="ms-auto fw-700" id="where"></span>
                <div id="results" class="position-absolute glass glass-sm d-none" style="top:52px;left:0;z-index:20;min-width:300px"></div>
            </div>
        </div>

        <div id="wx"><div class="glass text-muted"><span class="spin bi bi-arrow-repeat"></span> Getting forecast...</div></div>
    </div></main>
</div>
<nav class="bottom-nav" id="bottomNav"></nav>
<script src="js/app.js"></script>
<script>
    CD.shell("weather");
    const me = CD.user();
    let chart, forecast, dayIdx = 0;

    async function load(lat, lon, label) {
        CD.$("#where").innerHTML = `<i class="bi bi-pin-map text-lime"></i> ${CD.esc(label)}`;
        CD.$("#wx").innerHTML = `<div class="glass text-muted"><span class="spin bi bi-arrow-repeat"></span> Getting forecast...</div>`;
        try {
            forecast = await CD.weatherRisk(lat, lon);
            dayIdx = 0;
            render();
            if (me && !me.latitude) {   // remember the farm location
                const u = await CD.api("/api/users/" + me.id, { method: "PUT", body: { latitude: +lat, longitude: +lon, village: me.village || label } });
                CD.setUser(u);
            }
        } catch (e) {
            CD.$("#wx").innerHTML = `<div class="glass empty"><i class="bi bi-cloud-slash"></i>${CD.esc(e.message)}</div>`;
        }
    }

    function render() {
        const w = forecast, c = w.current;
        const peak = Math.max(...w.days.map(d => d.overall));
        const lvl = w.days.find(d => d.overall === peak).level;
        CD.$("#wx").innerHTML = `
        <div class="row g-3">
            <div class="col-lg-4"><div class="glass h-100 reveal d1">
                <div class="small-caps">Right now</div>
                <div class="d-flex align-items-center gap-3 my-2"><i class="bi ${CD.weatherIcon(c.weatherCode)}" style="font-size:3.4rem;color:var(--cd-amber)"></i>
                <div><div class="display-6 fw-800">${Math.round(c.temperature)}°C</div><div class="text-muted small">feels like field conditions</div></div></div>
                <div class="row g-2 small mt-1">
                    <div class="col-4"><div class="glass glass-sm text-center p-2"><i class="bi bi-droplet text-sky"></i><b class="d-block">${c.humidity}%</b><span class="text-muted">humidity</span></div></div>
                    <div class="col-4"><div class="glass glass-sm text-center p-2"><i class="bi bi-cloud-rain text-sky"></i><b class="d-block">${c.rain} mm</b><span class="text-muted">rain</span></div></div>
                    <div class="col-4"><div class="glass glass-sm text-center p-2"><i class="bi bi-wind text-sky"></i><b class="d-block">${Math.round(c.wind)}</b><span class="text-muted">km/h</span></div></div>
                </div>
                <div class="mt-3 p-3 rounded-4" style="background:var(--cd-grad-soft);border:1px solid var(--cd-border)">
                    <div class="small-caps">Week outlook</div><div class="d-flex align-items-center gap-2 mt-1"><span class="risk-pill risk-${lvl.split(" ")[0]}">${lvl}</span><b>${peak}% peak risk</b></div>
                    <div class="small text-muted mt-1">${CD.esc(w.summary)}</div>
                </div>
            </div></div>
            <div class="col-lg-8"><div class="glass h-100 reveal d2">
                <div class="d-flex justify-content-between"><div><div class="small-caps">Infection risk index</div><h5 class="fw-800">Next 7 days</h5></div></div>
                <div style="height:290px"><canvas id="chart"></canvas></div>
            </div></div>
        </div>
        <div class="row g-2 mt-1">${w.days.map((d, i) => `
            <div class="col"><div class="wx-day ${i === dayIdx ? "active" : ""}" data-i="${i}">
                <div class="small fw-700">${i === 0 ? "Today" : new Date(d.date).toLocaleDateString(undefined, { weekday: "short" })}</div>
                <i class="bi ${CD.weatherIcon(d.weatherCode)} ic" style="color:var(--cd-amber)"></i>
                <div class="small"><b>${Math.round(d.tMax)}°</b> <span class="text-muted">${Math.round(d.tMin)}°</span></div>
                <div class="text-muted" style="font-size:.7rem"><i class="bi bi-droplet"></i> ${d.rain} mm</div>
                <span class="risk-pill mt-1 risk-${d.level.split(" ")[0]}">${d.overall}%</span>
            </div></div>`).join("")}</div>
        <div class="row g-3 mt-1">
            <div class="col-lg-6"><div class="glass h-100" id="dayBox"></div></div>
            <div class="col-lg-6"><div class="glass h-100 reveal d3"><div class="small-caps">What to do</div><h5 class="fw-800 mb-2">Spray & scouting advice</h5>
                <ul class="tick-list shield">${w.advice.map(a => `<li>${CD.esc(a)}</li>`).join("")}</ul></div></div>
        </div>
        <div class="small text-muted mt-3"><i class="bi bi-info-circle"></i> Risk = hours per day that match each disease's infection weather (temperature + humidity/leaf wetness + rain). It shows when conditions favour disease, not that disease is present.</div>`;

        document.querySelectorAll(".wx-day").forEach(el => el.onclick = () => { dayIdx = +el.dataset.i; document.querySelectorAll(".wx-day").forEach(x => x.classList.toggle("active", x === el)); dayDetail(); });
        dayDetail();

        Chart.defaults.color = "#8FA89A";
        Chart.defaults.font.family = "Plus Jakarta Sans";
        const names = Object.keys(w.days[0].risks);
        const cols = ["#F87171", "#FBBF24", "#FB923C", "#38BDF8", "#A78BFA"];
        if (chart) chart.destroy();
        chart = new Chart(CD.$("#chart"), {
            type: "line",
            data: {
                labels: w.days.map((d, i) => i === 0 ? "Today" : new Date(d.date).toLocaleDateString(undefined, { weekday: "short", day: "numeric" })),
                datasets: names.map((n, k) => ({ label: n, data: w.days.map(d => d.risks[n]), borderColor: cols[k], backgroundColor: cols[k], tension: .35, pointRadius: 3, borderWidth: 2.5 }))
            },
            options: { maintainAspectRatio: false, interaction: { mode: "index", intersect: false },
                plugins: { legend: { position: "bottom", labels: { boxWidth: 10, font: { size: 11 } } } },
                scales: { y: { min: 0, max: 100, ticks: { callback: v => v + "%" }, grid: { color: "rgba(255,255,255,.05)" } }, x: { grid: { display: false } } } }
        });
    }

    function dayDetail() {
        const d = forecast.days[dayIdx];
        CD.$("#dayBox").innerHTML = `<div class="small-caps">${new Date(d.date).toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long" })}</div>
            <h5 class="fw-800 mb-3">Risk by disease group</h5>
            ${Object.entries(d.risks).map(([k, v]) => `<div class="mb-2"><div class="d-flex justify-content-between small fw-700"><span>${k}</span><span>${v}%</span></div>
              <div class="meter" style="height:8px"><span style="width:${v}%;background:${v >= 75 ? "#F87171" : v >= 50 ? "#FB923C" : v >= 25 ? "#FBBF24" : "#22C55E"}"></span></div></div>`).join("")}
            <div class="small text-muted mt-2">Avg humidity ${d.humidity}% · ${Math.round(d.tMin)}-${Math.round(d.tMax)} °C · rain ${d.rain} mm</div>`;
    }

    // place search
    let t;
    CD.$("#place").addEventListener("input", e => {
        clearTimeout(t);
        const q = e.target.value.trim();
        if (q.length < 2) { CD.$("#results").classList.add("d-none"); return; }
        t = setTimeout(async () => {
            try {
                const res = await CD.api("/api/weather/search?q=" + encodeURIComponent(q));
                const box = CD.$("#results");
                box.innerHTML = res.length ? res.map(p => `<div class="cand" style="cursor:pointer" data-lat="${p.latitude}" data-lon="${p.longitude}" data-n="${CD.esc(p.name)}">
                    <i class="bi bi-geo-alt text-lime"></i><span><b class="small d-block">${CD.esc(p.name)}</b><span class="text-muted" style="font-size:.75rem">${CD.esc(p.region)} ${CD.esc(p.country)}</span></span></div>`).join("")
                    : `<div class="small text-muted p-2">No place found.</div>`;
                box.classList.remove("d-none");
            } catch (err) { CD.toast(err.message, "err"); }
        }, 300);
    });
    CD.$("#results").addEventListener("click", e => {
        const r = e.target.closest("[data-lat]"); if (!r) return;
        CD.$("#results").classList.add("d-none");
        CD.$("#place").value = r.dataset.n;
        load(r.dataset.lat, r.dataset.lon, r.dataset.n);
    });
    CD.$("#gps").onclick = () => {
        if (!navigator.geolocation) return CD.toast("Location is not available in this browser.", "err");
        navigator.geolocation.getCurrentPosition(p => load(p.coords.latitude.toFixed(3), p.coords.longitude.toFixed(3), "My location"),
            () => CD.toast("Location permission denied. Search your village instead.", "err"), { timeout: 8000 });
    };

    if (me && me.latitude) load(me.latitude, me.longitude, me.village || "My farm");
    else load(18.52, 73.86, "Pune (default)");
</script>
</body>
</html>
