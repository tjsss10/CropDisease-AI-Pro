<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Sign in · CropDisease AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/app.css" rel="stylesheet">
    <meta name="theme-color" content="#060D0A">
    <link rel="icon" href="img/logo.svg" type="image/svg+xml">
</head>
<body>
<div class="bg-orbs"><span></span><span></span><span></span></div>
<div class="container d-flex align-items-center justify-content-center" style="min-height:100vh;max-width:460px">
    <div class="w-100 py-4">
        <a href="index.html" class="brand justify-content-center mb-2"><span class="brand-mark"><i class="bi bi-flower1"></i></span>
            <span><b>CropDisease <span class="text-grad">AI</span></b><small>Pro · v2</small></span></a>
        <form class="glass p-4 reveal d1" id="form">
            <h3 class="fw-800 mb-1">Welcome back</h3>
            <p class="text-muted small mb-4">Sign in to see your farm dashboard and scan history.</p>
            <label class="form-label">Email</label>
            <input type="email" class="form-control mb-3" id="email" required autocomplete="email" placeholder="you@example.com">
            <label class="form-label">Password</label>
            <div class="input-group mb-4">
                <input type="password" class="form-control" id="pw" required autocomplete="current-password" placeholder="••••••">
                <button class="btn btn-glass" type="button" id="eye"><i class="bi bi-eye"></i></button>
            </div>
            <button class="btn btn-grad btn-lg w-100" id="btn">Sign in</button>
            <div class="text-center small mt-3">New here? <a href="signup.html">Create an account</a></div>
            <hr>
            <a href="scan.html" class="btn btn-glass w-100"><i class="bi bi-incognito"></i> Continue as guest</a>
        </form>
    </div>
</div>
<script src="js/app.js"></script>
<script>
    const next = new URLSearchParams(location.search).get("next") || "home.html";
    if (CD.user()) location.replace(next);
    CD.$("#eye").onclick = () => { const p = CD.$("#pw"); p.type = p.type === "password" ? "text" : "password"; };
    CD.$("#form").onsubmit = async e => {
        e.preventDefault();
        const b = CD.$("#btn"); b.disabled = true; b.innerHTML = `<span class="spin bi bi-arrow-repeat"></span> Signing in`;
        try {
            const u = await CD.api("/api/users/login", { method: "POST", body: { email: CD.$("#email").value, password: CD.$("#pw").value } });
            CD.setUser(u);
            location.href = /^[a-z]+\.html/.test(next) ? next : "home.html";
        } catch (err) { CD.toast(err.message, "err"); b.disabled = false; b.textContent = "Sign in"; }
    };
</script>
</body>
</html>
