<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Profile · CropDisease AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/app.css" rel="stylesheet">
    <meta name="theme-color" content="#060D0A">
    <link rel="icon" href="img/logo.svg" type="image/svg+xml">
</head>
<body>
<div class="bg-orbs"><span></span><span></span><span></span></div>
<div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main"><div class="content" style="max-width:820px">
        <div class="mobile-head align-items-center mb-3" id="mobileHead"></div>
        <div class="glass card-grad mb-3 reveal d1 d-flex align-items-center gap-3">
            <span class="avatar" style="width:72px;height:72px;font-size:1.6rem;border-radius:22px" id="av"></span>
            <div class="flex-grow-1"><h3 class="fw-800 mb-0" id="nm"></h3><div style="color:rgba(5,46,22,.75)" id="sub"></div></div>
            <button class="btn btn-dark fw-700" id="out"><i class="bi bi-box-arrow-right"></i> <span class="d-none d-sm-inline">Sign out</span></button>
        </div>
        <form class="glass reveal d2" id="form">
            <h5 class="fw-800 mb-3">Farm profile</h5>
            <div class="row g-3">
                <div class="col-sm-6"><label class="form-label">Full name</label><input class="form-control" id="fullName"></div>
                <div class="col-sm-6"><label class="form-label">Phone</label><input class="form-control" id="phone"></div>
                <div class="col-sm-6"><label class="form-label">Village / town</label><input class="form-control" id="village"></div>
                <div class="col-sm-6"><label class="form-label">Farm size (acres)</label><input type="number" step="0.1" class="form-control" id="farmSizeAcres"></div>
                <div class="col-sm-6"><label class="form-label">Main crop</label><select class="form-select" id="primaryCrop"><option value="">—</option></select></div>
                <div class="col-sm-6"><label class="form-label">Farm location (for weather)</label>
                    <div class="input-group"><input class="form-control" id="loc" readonly placeholder="not set"><button type="button" class="btn btn-glass" id="gps"><i class="bi bi-crosshair"></i></button></div></div>
            </div>
            <button class="btn btn-grad mt-4"><i class="bi bi-check2"></i> Save profile</button>
        </form>
    </div></main>
</div>
<nav class="bottom-nav" id="bottomNav"></nav>
<script src="js/app.js"></script>
<script>
    CD.shell("");
    let me = CD.requireUser();
    let lat = me.latitude, lon = me.longitude;
    function fill() {
        CD.$("#av").textContent = CD.initials(me.fullName);
        CD.$("#nm").textContent = me.fullName;
        CD.$("#sub").textContent = me.email + " · member since " + new Date(me.createdAt).toLocaleDateString();
        ["fullName", "phone", "village", "farmSizeAcres"].forEach(k => CD.$("#" + k).value = me[k] ?? "");
        CD.$("#loc").value = lat ? `${lat}, ${lon}` : "";
    }
    CD.crops().then(cs => {
        CD.$("#primaryCrop").innerHTML += cs.filter(c => c.code !== "general").map(c => `<option value="${c.code}">${c.emoji} ${CD.esc(c.name)}</option>`).join("");
        CD.$("#primaryCrop").value = me.primaryCrop || "";
    });
    fill();
    CD.api("/api/users/" + me.id).then(u => { me = u; CD.setUser(u); lat = u.latitude; lon = u.longitude; fill(); }).catch(e => { if (e.status === 404) CD.logout(); });
    CD.$("#gps").onclick = () => navigator.geolocation.getCurrentPosition(p => { lat = +p.coords.latitude.toFixed(4); lon = +p.coords.longitude.toFixed(4); CD.$("#loc").value = `${lat}, ${lon}`; },
        () => CD.toast("Location permission denied.", "err"));
    CD.$("#out").onclick = CD.logout;
    CD.$("#form").onsubmit = async e => {
        e.preventDefault();
        try {
            me = await CD.api("/api/users/" + me.id, { method: "PUT", body: {
                fullName: CD.$("#fullName").value, phone: CD.$("#phone").value, village: CD.$("#village").value,
                farmSizeAcres: CD.$("#farmSizeAcres").value ? +CD.$("#farmSizeAcres").value : 0, primaryCrop: CD.$("#primaryCrop").value,
                latitude: lat, longitude: lon } });
            CD.setUser(me); fill(); CD.shell("");
            CD.toast("Profile saved.", "ok");
        } catch (err) { CD.toast(err.message, "err"); }
    };
</script>
</body>
</html>
