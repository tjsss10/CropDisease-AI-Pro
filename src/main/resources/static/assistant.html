<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Krishi Mitra · CropDisease AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/app.css" rel="stylesheet">
    <meta name="theme-color" content="#060D0A">
    <link rel="icon" href="img/logo.svg" type="image/svg+xml">
</head>
<body>
<div class="bg-orbs"><span></span><span></span><span></span></div>
<div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main"><div class="content" style="max-width:900px">
        <div class="mobile-head align-items-center mb-3" id="mobileHead"></div>
        <div class="topbar">
            <div class="stat-ico ico-teal"><i class="bi bi-robot"></i></div>
            <div class="flex-grow-1"><h1>Krishi Mitra</h1><div class="sub">Your farm assistant · answers from the CropDisease knowledge base</div></div>
        </div>
        <div class="glass p-3">
            <div class="chat" id="chat"></div>
            <div class="chip-scroll my-2" id="sugg"></div>
            <form class="d-flex gap-2" id="form">
                <button type="button" class="icon-btn flex-shrink-0" id="mic" title="Speak"><i class="bi bi-mic"></i></button>
                <input class="form-control" id="q" placeholder="Ask e.g. how to treat rice blast?" autocomplete="off">
                <button class="btn btn-grad px-3"><i class="bi bi-send-fill"></i></button>
            </form>
        </div>
    </div></main>
</div>
<nav class="bottom-nav" id="bottomNav"></nav>
<script src="js/app.js"></script>
<script>
    CD.shell("assistant");
    const chat = CD.$("#chat");

    function add(html, who) {
        const m = document.createElement("div");
        m.className = "msg " + who;
        m.innerHTML = html;
        chat.appendChild(m);
        chat.scrollTop = chat.scrollHeight;
        return m;
    }
    function suggestions(list) {
        CD.$("#sugg").innerHTML = (list || []).map(s => `<span class="chip">${CD.esc(s)}</span>`).join("");
    }
    CD.$("#sugg").addEventListener("click", e => { const c = e.target.closest(".chip"); if (c) ask(c.textContent); });

    async function ask(q) {
        q = q.trim(); if (!q) return;
        add(CD.esc(q), "me");
        CD.$("#q").value = "";
        const t = add(`<span class="typing"><span></span><span></span><span></span></span>`, "bot");
        try {
            const [r] = await Promise.all([CD.api("/api/assistant", { method: "POST", body: { question: q } }), new Promise(x => setTimeout(x, 600))]);
            t.innerHTML = `${CD.esc(r.text)}${r.bullets.length ? `<ul>${r.bullets.map(b => `<li>${CD.esc(b)}</li>`).join("")}</ul>` : ""}
                <div class="d-flex gap-2 mt-2">
                  ${r.diseaseCode ? `<a class="btn btn-glass btn-sm" href="disease.html?code=${r.diseaseCode}"><i class="bi bi-journal-medical"></i> Full guide</a>` : ""}
                  <button class="btn btn-glass btn-sm" data-say><i class="bi bi-volume-up"></i></button></div>`;
            t.querySelector("[data-say]").onclick = () => CD.speak(r.text + ". " + r.bullets.join(". "));
            suggestions(r.suggestions);
        } catch (e) { t.textContent = e.message; }
        chat.scrollTop = chat.scrollHeight;
    }

    CD.$("#form").onsubmit = e => { e.preventDefault(); ask(CD.$("#q").value); };

    // voice input (Chrome / Edge / Android)
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SR) {
        const rec = new SR(); rec.lang = "en-IN"; rec.interimResults = false;
        rec.onresult = e => ask(e.results[0][0].transcript);
        rec.onend = () => CD.$("#mic").classList.remove("text-lime");
        CD.$("#mic").onclick = () => { CD.$("#mic").classList.add("text-lime"); rec.start(); };
    } else CD.$("#mic").onclick = () => CD.toast("Voice input isn't supported in this browser.");

    add(`Namaste${CD.user() ? " " + CD.esc(CD.user().fullName.split(" ")[0]) : ""}! 🌱 I'm <b>Krishi Mitra</b>. Ask me about any crop disease — symptoms, causes, organic or chemical treatment, or prevention.`, "bot");
    suggestions(["How to treat tomato late blight?", "Organic control for powdery mildew", "Diseases of rice", "Symptoms of wheat yellow rust", "What causes cotton leaf curl?"]);
</script>
</body>
</html>
