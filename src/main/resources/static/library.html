<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Disease Library · CropDisease AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/app.css" rel="stylesheet">
    <meta name="theme-color" content="#060D0A">
    <link rel="icon" href="img/logo.svg" type="image/svg+xml">
</head>
<body>
<div class="bg-orbs"><span></span><span></span><span></span></div>
<div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main"><div class="content">
        <div class="mobile-head align-items-center mb-3" id="mobileHead"></div>
        <div class="topbar">
            <div class="flex-grow-1"><div class="small-caps">Crop doctor encyclopedia</div><h1>Disease Library</h1>
                <div class="sub">Symptoms, causes, organic & chemical treatment and prevention for every disease.</div></div>
        </div>

        <div class="chip-scroll mb-3" id="cropChips"></div>

        <div class="glass glass-sm mb-3 d-flex flex-wrap gap-2 align-items-center">
            <div class="input-group" style="max-width:360px"><span class="input-group-text"><i class="bi bi-search"></i></span>
                <input class="form-control" id="q" placeholder="Search e.g. blight, rust, yellow spots..."></div>
            <div class="chip-row" id="types">
                <span class="chip active" data-t="">All types</span>
                <span class="chip" data-t="Fungal">Fungal</span>
                <span class="chip" data-t="Bacterial">Bacterial</span>
                <span class="chip" data-t="Viral">Viral</span>
                <span class="chip" data-t="Oomycete">Oomycete</span>
                <span class="chip" data-t="Nutrient">Nutrient</span>
            </div>
            <span class="ms-auto small text-muted" id="count"></span>
        </div>

        <div class="row g-3" id="grid"></div>
    </div></main>
</div>
<nav class="bottom-nav" id="bottomNav"></nav>
<script src="js/app.js"></script>
<script>
    CD.shell("library");
    const params = new URLSearchParams(location.search);
    let crop = params.get("crop") || "", type = "", cropsList = [];

    (async () => {
        cropsList = await CD.crops();
        const box = CD.$("#cropChips");
        box.innerHTML = `<span class="chip ${crop ? "" : "active"}" data-c="">🌍 All crops</span>` +
            cropsList.map(c => `<span class="chip ${crop === c.code ? "active" : ""}" data-c="${c.code}">${c.emoji} ${CD.esc(c.name)} <span class="text-muted">${c.diseaseCount}</span></span>`).join("");
        box.addEventListener("click", e => {
            const c = e.target.closest(".chip"); if (!c) return;
            crop = c.dataset.c;
            box.querySelectorAll(".chip").forEach(x => x.classList.toggle("active", x === c));
            load();
        });
        load();
    })();

    CD.$("#types").addEventListener("click", e => {
        const c = e.target.closest(".chip"); if (!c) return;
        type = c.dataset.t;
        CD.$("#types").querySelectorAll(".chip").forEach(x => x.classList.toggle("active", x === c));
        load();
    });
    let t;
    CD.$("#q").addEventListener("input", () => { clearTimeout(t); t = setTimeout(load, 220); });

    async function load() {
        const q = CD.$("#q").value.trim();
        const list = await CD.api(`/api/diseases?crop=${encodeURIComponent(crop)}&type=${type}&q=${encodeURIComponent(q)}`);
        CD.$("#count").textContent = list.length + " diseases";
        CD.$("#grid").innerHTML = list.length ? list.map((d, i) => {
            const c = cropsList.find(x => x.code === d.cropCode) || {};
            const sym = CD.split(d.symptoms);
            return `<div class="col-md-6 col-xl-4"><a class="d-card" href="disease.html?code=${encodeURIComponent(d.code)}">
                <div class="glass hoverable h-100 reveal d${(i % 5) + 1}">
                    <div class="sev-bar mb-3" style="background:${CD.sevColor(d.severity)};width:${{ Low: 25, Moderate: 50, High: 75, Critical: 100 }[d.severity]}%"></div>
                    <div class="d-flex gap-3 align-items-start">
                        <div class="stat-ico" style="background:rgba(255,255,255,.05);font-size:1.6rem">${c.emoji || "🌿"}</div>
                        <div class="min-w-0"><b class="d-block">${CD.esc(d.name)}</b><span class="text-muted small"><i>${CD.esc(d.pathogen)}</i></span></div>
                    </div>
                    <div class="d-flex flex-wrap gap-1 my-3">
                        <span class="badge-soft b-gray">${CD.esc(c.name || d.cropCode)}</span>
                        <span class="badge-soft ${CD.typeBadge(d.type)}">${d.type}</span>
                        <span class="badge-soft ${CD.sevBadge(d.severity)}">${d.severity}</span>
                        <span class="badge-soft b-gray">loss ${CD.esc(d.yieldLoss)}</span>
                    </div>
                    <div class="small text-muted">${CD.esc(sym[0] || "")}${sym[1] ? " · " + CD.esc(sym[1]) : ""}</div>
                </div></a></div>`;
        }).join("") : `<div class="col-12"><div class="glass empty"><i class="bi bi-search"></i>No diseases match your search.</div></div>`;
    }
</script>
</body>
</html>
