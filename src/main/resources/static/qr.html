<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Open on your phone · CropDisease AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/app.css" rel="stylesheet">
    <link rel="icon" href="img/logo.svg" type="image/svg+xml">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
</head>
<body>
<div class="bg-orbs"><span></span><span></span><span></span></div>
<div class="container d-flex align-items-center justify-content-center" style="min-height:100vh;max-width:480px">
    <div class="w-100 text-center py-4">
        <a href="index.html" class="brand justify-content-center"><span class="brand-mark"><i class="bi bi-flower1"></i></span>
            <span class="text-start"><b>CropDisease <span class="text-grad">AI</span></b><small>Pro · v2</small></span></a>
        <div class="glass p-4 reveal d1">
            <h4 class="fw-800">Scan to open on your phone</h4>
            <p class="text-muted small">Phone and this laptop must be on the same Wi-Fi.</p>
            <div id="qr" class="d-inline-block p-3 rounded-4 my-2" style="background:#fff"></div>
            <div class="fs-5 fw-800 text-grad my-2" id="url" style="word-break:break-all">detecting address...</div>
            <div class="text-start small mt-3">
                <div class="timeline">
                    <div class="t-item">Open the <b>Camera</b> app on your phone and point it at the code.</div>
                    <div class="t-item">Tap the link that appears.</div>
                    <div class="t-item">Tap <b>Add to Home screen</b> in the browser menu to use it like an app.</div>
                </div>
            </div>
            <div class="small text-muted" id="others"></div>
            <a href="home.html" class="btn btn-grad w-100 mt-3">Open on this computer</a>
        </div>
    </div>
</div>
<script src="js/app.js"></script>
<script>
    CD.api("/api/server-info").then(info => {
        const url = info.urls[0] || location.origin;
        const qr = qrcode(0, "M");
        qr.addData(url);
        qr.make();
        CD.$("#qr").innerHTML = qr.createSvgTag({ cellSize: 7, margin: 0 });
        CD.$("#url").textContent = url;
        if (info.cloud) {
            document.querySelector("h4").textContent = "Scan to open CropDisease AI";
            document.querySelector("h4 + p").textContent = "Permanent link - works on any phone, any network (Wi-Fi or mobile data).";
        }
        if (info.urls.length > 1) CD.$("#others").innerHTML = "Other addresses: " + info.urls.slice(1).map(CD.esc).join(", ");
        if (!info.urls.length) CD.$("#others").textContent = "No Wi-Fi network found - connect this laptop to Wi-Fi.";
    }).catch(e => CD.$("#url").textContent = e.message);
</script>
</body>
</html>
