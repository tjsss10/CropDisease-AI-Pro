<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Scan Report · CropDisease AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/app.css" rel="stylesheet">
    <link rel="icon" href="img/logo.svg" type="image/svg+xml">
    <style>
        .main { padding-bottom: 40px; }
        @media print { .compare input, .compare .handle { display: none; } .compare .top { clip-path: none !important; position: relative; } }
    </style>
</head>
<body>
<div class="bg-orbs"><span></span><span></span><span></span></div>
<main class="main"><div class="content" style="max-width:980px">
    <div class="d-flex align-items-center gap-3 mb-4">
        <span class="brand-mark"><i class="bi bi-flower1"></i></span>
        <div class="flex-grow-1"><b class="fs-5">CropDisease <span class="text-grad">AI</span> Pro</b>
            <div class="text-muted small">Leaf disease diagnosis report</div></div>
        <div class="no-print d-flex gap-2">
            <a href="history.html" class="btn btn-glass btn-sm"><i class="bi bi-arrow-left"></i> Back</a>
            <button class="btn btn-grad btn-sm" onclick="window.print()"><i class="bi bi-file-earmark-pdf"></i> Save as PDF</button>
        </div>
    </div>
    <div class="glass glass-sm mb-3"><div class="row small g-2" id="meta"></div></div>
    <div id="report"><div class="text-muted"><span class="spin bi bi-arrow-repeat"></span> Loading report...</div></div>
    <div class="text-muted small mt-4 text-center">Generated by CropDisease AI Pro · computer-vision estimate from one photo, not a laboratory test.</div>
</div></main>
<script src="js/app.js"></script>
<script>
    const me = CD.requireUser();
    const id = new URLSearchParams(location.search).get("id");
    (async () => {
        const data = await CD.api(`/api/scans/${id}?userId=${me.id}`);
        CD.$("#meta").innerHTML = [
            ["Report no.", "CD-" + String(data.scanId).padStart(5, "0")],
            ["Date", CD.fmtDate(data.createdAt)],
            ["Farmer", me.fullName + (me.village ? ", " + me.village : "")],
            ["Field / crop", (data.fieldName || "—") + " / " + await CD.cropName(data.crop)],
        ].map(([k, v]) => `<div class="col-6 col-md-3"><div class="text-muted">${k}</div><b>${CD.esc(v)}</b></div>`).join("");
        CD.renderResult(CD.$("#report"), data);
        document.title = "CropDisease report CD-" + data.scanId;
    })().catch(e => CD.$("#report").innerHTML = `<div class="glass empty"><i class="bi bi-exclamation-circle"></i>${CD.esc(e.message)}</div>`);
</script>
</body>
</html>
