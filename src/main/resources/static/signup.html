<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Create account · CropDisease AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/app.css" rel="stylesheet">
    <meta name="theme-color" content="#060D0A">
    <link rel="icon" href="img/logo.svg" type="image/svg+xml">
</head>
<body>
<div class="bg-orbs"><span></span><span></span><span></span></div>
<div class="container d-flex align-items-center justify-content-center" style="min-height:100vh;max-width:560px">
    <div class="w-100 py-4">
        <a href="index.html" class="brand justify-content-center mb-2"><span class="brand-mark"><i class="bi bi-flower1"></i></span>
            <span><b>CropDisease <span class="text-grad">AI</span></b><small>Pro · v2</small></span></a>
        <form class="glass p-4 reveal d1" id="form">
            <h3 class="fw-800 mb-1">Create your farm account</h3>
            <p class="text-muted small mb-4">Free. Saves your scans, health trends and reports.</p>
            <div class="row g-3">
                <div class="col-12"><label class="form-label">Full name *</label><input class="form-control" id="name" required placeholder="Ramesh Patil"></div>
                <div class="col-sm-6"><label class="form-label">Email *</label><input type="email" class="form-control" id="email" required autocomplete="email"></div>
                <div class="col-sm-6"><label class="form-label">Password * (6+ chars)</label><input type="password" class="form-control" id="pw" required minlength="6" autocomplete="new-password"></div>
                <div class="col-sm-6"><label class="form-label">Phone</label><input class="form-control" id="phone" inputmode="tel" placeholder="optional"></div>
                <div class="col-sm-6"><label class="form-label">Village / town</label><input class="form-control" id="village" placeholder="optional"></div>
                <div class="col-sm-6"><label class="form-label">Farm size (acres)</label><input type="number" step="0.1" min="0" class="form-control" id="size" placeholder="optional"></div>
                <div class="col-sm-6"><label class="form-label">Main crop</label><select class="form-select" id="crop"><option value="">Choose...</option></select></div>
            </div>
            <button class="btn btn-grad btn-lg w-100 mt-4" id="btn">Create account</button>
            <div class="text-center small mt-3">Already registered? <a href="login.html">Sign in</a></div>
        </form>
    </div>
</div>
<script src="js/app.js"></script>
<script>
    CD.crops().then(cs => CD.$("#crop").innerHTML += cs.filter(c => c.code !== "general").map(c => `<option value="${c.code}">${c.emoji} ${CD.esc(c.name)}</option>`).join(""));
    CD.$("#form").onsubmit = async e => {
        e.preventDefault();
        const b = CD.$("#btn"); b.disabled = true;
        try {
            const u = await CD.api("/api/users/signup", { method: "POST", body: {
                fullName: CD.$("#name").value, email: CD.$("#email").value, password: CD.$("#pw").value,
                phone: CD.$("#phone").value, village: CD.$("#village").value,
                farmSizeAcres: CD.$("#size").value ? +CD.$("#size").value : null, primaryCrop: CD.$("#crop").value } });
            CD.setUser(u);
            location.href = "home.html";
        } catch (err) { CD.toast(err.message, "err"); b.disabled = false; }
    };
</script>
</body>
</html>
