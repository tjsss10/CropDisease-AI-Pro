<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Scan History · CropDisease AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/app.css" rel="stylesheet">
    <meta name="theme-color" content="#060D0A">
    <link rel="icon" href="img/logo.svg" type="image/svg+xml">
</head>
<body>
<div class="bg-orbs"><span></span><span></span><span></span></div>
<div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main"><div class="content">
        <div class="mobile-head align-items-center mb-3" id="mobileHead"></div>

        <section id="listView">
            <div class="topbar">
                <div class="flex-grow-1"><div class="small-caps">Saved in MySQL</div><h1>Scan History</h1>
                    <div class="sub">Every leaf you scanned, with its diagnosis, health score and heatmap.</div></div>
                <a href="scan.html" class="btn btn-grad"><i class="bi bi-camera"></i> <span class="d-none d-sm-inline">New scan</span></a>
            </div>
            <div class="glass glass-sm mb-3 d-flex flex-wrap gap-2 align-items-center">
                <div class="input-group" style="max-width:320px"><span class="input-group-text"><i class="bi bi-search"></i></span>
                    <input class="form-control" id="q" placeholder="Search disease, field, crop..."></div>
                <div class="chip-row" id="filters">
                    <span class="chip active" data-f="all">All</span>
                    <span class="chip" data-f="DISEASED">Diseased</span>
                    <span class="chip" data-f="UNCERTAIN">Uncertain</span>
                    <span class="chip" data-f="HEALTHY">Healthy</span>
                </div>
                <span class="ms-auto text-muted small" id="count"></span>
            </div>
            <div class="row g-3" id="list"></div>
        </section>

        <section id="detailView" class="d-none">
            <div class="topbar">
                <button class="icon-btn" id="back"><i class="bi bi-arrow-left"></i></button>
                <div class="flex-grow-1"><div class="small-caps" id="dDate"></div><h1 id="dTitle">Scan</h1></div>
                <button class="btn btn-glass btn-sm" id="del"><i class="bi bi-trash"></i> Delete</button>
            </div>
            <div id="dNotes"></div>
            <div id="detail"></div>
        </section>
    </div></main>
</div>
<nav class="bottom-nav" id="bottomNav"></nav>

<script src="js/app.js"></script>
<script>
    CD.shell("history");
    const me = CD.requireUser();
    let scans = [], filter = "all", openId = null;

    async function load() {
        scans = await CD.api("/api/scans?userId=" + me.id);
        render();
        const open = new URLSearchParams(location.search).get("open");
        if (open) openScan(open);
    }

    function render() {
        const q = CD.$("#q").value.trim().toLowerCase();
        const list = scans.filter(s => (filter === "all" || s.status === filter) &&
            (!q || (s.diagnosis + " " + (s.fieldName || "") + " " + s.cropCode + " " + (s.notes || "")).toLowerCase().includes(q)));
        CD.$("#count").textContent = list.length + " of " + scans.length + " scans";
        CD.$("#list").innerHTML = list.length ? list.map((s, i) => `
            <div class="col-sm-6 col-xl-4"><div class="glass glass-sm hoverable h-100 reveal d${(i % 5) + 1}" style="cursor:pointer" data-id="${s.id}">
                <div class="position-relative mb-3" style="aspect-ratio:16/10;border-radius:14px;overflow:hidden;background:#000">
                    <img src="${s.heatmapPath}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.35" alt="">
                    <img src="${s.imagePath}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain" alt="">
                    <span class="position-absolute top-0 end-0 m-2 badge-soft ${s.status === "HEALTHY" ? "b-green" : s.status === "UNCERTAIN" ? "b-amber" : "b-red"}">${s.status.toLowerCase()}</span>
                </div>
                <div class="d-flex justify-content-between gap-2">
                    <div class="min-w-0"><b class="d-block text-truncate">${CD.esc(s.diagnosis)}</b>
                    <div class="text-muted small">${CD.timeAgo(s.createdAt)} · <span data-crop="${s.cropCode}">${CD.esc(s.cropCode)}</span>${s.fieldName ? " · " + CD.esc(s.fieldName) : ""}</div></div>
                    <div class="text-end"><b class="${s.healthScore >= 80 ? "text-lime" : s.healthScore >= 55 ? "text-amber" : "text-red"}">${s.healthScore}</b><div class="text-muted" style="font-size:.68rem">health</div></div>
                </div>
                <div class="meter mt-2" style="height:6px"><span style="width:${Math.round(s.confidence * 100)}%"></span></div>
                <div class="d-flex justify-content-between text-muted mt-1" style="font-size:.72rem"><span>${Math.round(s.confidence * 100)}% confidence</span><span>${s.severityPct}% affected · ${s.stage}</span></div>
            </div></div>`).join("")
            : `<div class="col-12"><div class="glass empty"><i class="bi bi-inbox"></i>${scans.length ? "No scans match this filter." : "No scans yet. <a href='scan.html'>Scan your first leaf</a>."}</div></div>`;
        document.querySelectorAll("[data-crop]").forEach(async el => el.textContent = await CD.cropName(el.dataset.crop));
    }

    async function openScan(id) {
        try {
            const data = await CD.api(`/api/scans/${id}?userId=${me.id}`);
            openId = id;
            CD.$("#dTitle").textContent = data.diagnosis.title;
            CD.$("#dDate").textContent = CD.fmtDate(data.createdAt);
            CD.$("#dNotes").innerHTML = (data.fieldName || data.notes) ? `<div class="glass glass-sm mb-3 small"><i class="bi bi-sticky text-amber"></i> ${data.fieldName ? "<b>" + CD.esc(data.fieldName) + "</b> · " : ""}${CD.esc(data.notes || "")}</div>` : "";
            CD.renderResult(CD.$("#detail"), data);
            CD.$("#listView").classList.add("d-none");
            CD.$("#detailView").classList.remove("d-none");
            history.replaceState(null, "", "history.html?open=" + id);
            window.scrollTo(0, 0);
        } catch (e) { CD.toast(e.message, "err"); }
    }

    CD.$("#list").addEventListener("click", e => { const c = e.target.closest("[data-id]"); if (c) openScan(c.dataset.id); });
    CD.$("#back").onclick = () => { CD.$("#detailView").classList.add("d-none"); CD.$("#listView").classList.remove("d-none"); history.replaceState(null, "", "history.html"); };
    CD.$("#del").onclick = async () => {
        if (!confirm("Delete this scan and its photos permanently?")) return;
        await CD.api(`/api/scans/${openId}?userId=${me.id}`, { method: "DELETE" });
        CD.toast("Scan deleted.", "ok");
        scans = scans.filter(s => String(s.id) !== String(openId));
        CD.$("#back").click();
        render();
    };
    CD.$("#q").addEventListener("input", render);
    CD.$("#filters").addEventListener("click", e => {
        const c = e.target.closest(".chip"); if (!c) return;
        filter = c.dataset.f;
        document.querySelectorAll("#filters .chip").forEach(x => x.classList.toggle("active", x === c));
        render();
    });
    load().catch(e => CD.toast(e.message, "err"));
</script>
</body>
</html>
