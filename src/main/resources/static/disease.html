<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Disease · CropDisease AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/app.css" rel="stylesheet">
    <meta name="theme-color" content="#060D0A">
    <link rel="icon" href="img/logo.svg" type="image/svg+xml">
</head>
<body>
<div class="bg-orbs"><span></span><span></span><span></span></div>
<div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main"><div class="content">
        <div class="mobile-head align-items-center mb-3" id="mobileHead"></div>
        <div id="page"><div class="text-muted"><span class="spin bi bi-arrow-repeat"></span> Loading...</div></div>
    </div></main>
</div>
<nav class="bottom-nav" id="bottomNav"></nav>
<script src="js/app.js"></script>
<script>
    CD.shell("library");
    const code = new URLSearchParams(location.search).get("code");
    (async () => {
        const { disease: d, crop: c, related } = await CD.api("/api/diseases/" + encodeURIComponent(code));
        document.title = d.name + " · CropDisease AI";
        const sig = [["Chlorosis", d.sigYellow, "#FFD228"], ["Necrosis", d.sigBrown, "#FF4632"], ["Dark lesions", d.sigDark, "#DC28DC"], ["Powdery", d.sigWhite, "#3CDCFF"], ["Rust", d.sigRust, "#FF8C14"]];
        const list = (s, cls = "") => `<ul class="tick-list ${cls}">${CD.split(s).map(x => `<li>${CD.esc(x)}</li>`).join("")}</ul>`;
        CD.$("#page").innerHTML = `
        <div class="topbar">
            <a href="library.html?crop=${d.cropCode}" class="icon-btn"><i class="bi bi-arrow-left"></i></a>
            <div class="flex-grow-1"><div class="small-caps">${c ? c.emoji + " " + CD.esc(c.name) : ""}</div><h1>${CD.esc(d.name)}</h1>
            <div class="sub"><i>${CD.esc(d.pathogen)}</i></div></div>
            <button class="btn btn-glass btn-sm" id="say"><i class="bi bi-volume-up"></i> <span class="d-none d-sm-inline">Listen</span></button>
        </div>
        <div class="row g-3">
            <div class="col-lg-8">
                <div class="glass reveal d1 mb-3">
                    <div class="d-flex flex-wrap gap-2 mb-3">
                        <span class="badge-soft ${CD.typeBadge(d.type)}">${d.type}</span>
                        <span class="badge-soft ${CD.sevBadge(d.severity)}">${d.severity} risk</span>
                        <span class="badge-soft b-gray">Yield loss ${CD.esc(d.yieldLoss)}</span>
                    </div>
                    <p class="fs-6 mb-3">${CD.esc(d.description)}</p>
                    <div class="p-3 rounded-4 small" style="background:rgba(56,189,248,.07);border:1px solid rgba(56,189,248,.25)">
                        <i class="bi bi-thermometer-half text-sky"></i> <b>Favourable conditions:</b> ${CD.esc(d.favourableConditions)}</div>
                </div>
                <div class="glass reveal d2 mb-3"><h5 class="fw-800 mb-2"><i class="bi bi-search text-amber"></i> Symptoms</h5>${list(d.symptoms, "warn")}</div>
                <div class="row g-3">
                    <div class="col-md-6"><div class="glass h-100 reveal d3"><h5 class="fw-800 mb-2"><i class="bi bi-flower2 text-lime"></i> Organic control</h5>${list(d.organicTreatment)}</div></div>
                    <div class="col-md-6"><div class="glass h-100 reveal d3"><h5 class="fw-800 mb-2"><i class="bi bi-eyedropper text-violet" style="color:var(--cd-violet)"></i> Chemical control</h5>${list(d.chemicalTreatment, "flask")}
                        <div class="small text-muted mt-2">Follow the label dose and pre-harvest interval. <a href="spray.html">Calculate spray mix</a></div></div></div>
                </div>
                <div class="glass reveal d4 mt-3"><h5 class="fw-800 mb-2"><i class="bi bi-shield-check text-sky"></i> Prevention</h5>${list(d.prevention, "shield")}</div>
            </div>
            <div class="col-lg-4">
                <div class="glass reveal d2 mb-3">
                    <div class="small-caps">AI visual signature</div><h6 class="fw-800 mb-3">What the scanner looks for</h6>
                    ${sig.map(([k, v, col]) => `<div class="mb-2"><div class="d-flex justify-content-between small"><span>${k}</span><span class="text-muted">${Math.round(v * 100)}%</span></div>
                        <div class="meter" style="height:7px"><span style="width:${v * 100}%;background:${col}"></span></div></div>`).join("")}
                    <div class="small text-muted mt-3">Spread pattern: <b class="text-reset">${d.pattern.toLowerCase()}</b></div>
                </div>
                <a href="scan.html?crop=${d.cropCode === "general" ? "auto" : d.cropCode}" class="glass card-grad d-block text-decoration-none mb-3 reveal d3">
                    <i class="bi bi-camera fs-3"></i><b class="d-block mt-1">Think your crop has this?</b><span class="small" style="color:rgba(5,46,22,.75)">Scan a leaf to confirm in seconds.</span></a>
                ${related.length ? `<div class="glass reveal d4"><h6 class="fw-800 mb-2">Other ${c ? CD.esc(c.name) : ""} diseases</h6>
                    ${related.map(r => `<a class="cand text-decoration-none text-reset" href="disease.html?code=${r.code}"><i class="bi bi-chevron-right text-muted"></i><span class="flex-grow-1 small fw-700">${CD.esc(r.name)}</span><span class="badge-soft ${CD.typeBadge(r.type)}">${r.type}</span></a>`).join("")}</div>` : ""}
            </div>
        </div>`;
        CD.$("#say").onclick = () => CD.speak(`${d.name}. ${d.description}. Symptoms: ${CD.split(d.symptoms).join(". ")}. Organic control: ${CD.split(d.organicTreatment)[0]}. Chemical control: ${CD.split(d.chemicalTreatment)[0]}.`);
    })().catch(e => CD.$("#page").innerHTML = `<div class="glass empty"><i class="bi bi-exclamation-circle"></i>${CD.esc(e.message)}</div>`);
</script>
</body>
</html>
